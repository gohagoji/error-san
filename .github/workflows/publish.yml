name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "26.x"
  TARBALL: package.tgz

jobs:
  check-tag:
    name: Check release tag
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      dist_tag: ${{ steps.version.outputs.dist_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag and select npm dist-tag
        id: version
        run: |
          version="$(node --print "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi

          dist_tag="$(node --print \
            "require('./package.json').version.split('+', 1)[0].includes('-') ? 'next' : 'latest'")"
          echo "dist_tag=${dist_tag}" >> "${GITHUB_OUTPUT}"

  verify:
    name: Run release gate
    needs: check-tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs:
      - check-tag
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The npm trusted publisher configuration must match this repository, this
    # exact workflow filename (`publish.yml`), and the environment below.
    # Renaming this file or environment without updating npm breaks OIDC.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/error-san

    permissions:
      contents: read
      # Lets the job mint the OIDC token that npm exchanges for a short-lived
      # publish credential. Trusted publishing does not work without it.
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and pack
        run: |
          pnpm build
          pnpm pack --out "${RUNNER_TEMP}/${TARBALL}"

      - name: Check tarball contents
        run: |
          tar -xzf "${RUNNER_TEMP}/${TARBALL}" -C "${RUNNER_TEMP}"
          test -s "${RUNNER_TEMP}/package/dist/index.js"
          test -s "${RUNNER_TEMP}/package/dist/index.d.ts"

      - name: Validate package
        run: |
          pnpm exec publint --strict "${RUNNER_TEMP}/${TARBALL}"
          pnpm exec attw "${RUNNER_TEMP}/${TARBALL}" --profile esm-only

      # Installs the release tarball outside the repository so resolution goes
      # through the package's published exports map.
      - name: Smoke test packed package
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p smoke
          cd smoke

          cat > package.json <<'MANIFEST'
          { "name": "error-san-smoke-test", "private": true, "type": "module" }
          MANIFEST

          npm install --no-audit --no-fund "${RUNNER_TEMP}/${TARBALL}"

          node --input-type=module <<'SMOKE'
          import assert from "node:assert/strict";
          import { UnexpectedError, wrapAsync, wrapSync } from "error-san";

          assert.equal(wrapSync.try(() => 42)().unwrap(), 42);
          assert.equal((await wrapAsync.try(async () => 42)()).unwrap(), 42);

          const reason = new Error("smoke test");
          const failure = wrapSync.try(() => {
            throw reason;
          })();

          assert.equal(failure.isOk, false);
          assert.equal(failure.code, "UnexpectedError");
          assert.equal(failure.reason, reason);
          assert.throws(
            () => failure.unwrap(),
            (error) =>
              error instanceof UnexpectedError && error.reason === reason,
          );
          SMOKE

      # Authentication comes from npm trusted publishing, so no
      # NODE_AUTH_TOKEN is needed.
      - name: Publish to npm
        env:
          DIST_TAG: ${{ needs.check-tag.outputs.dist_tag }}
        run: pnpm publish "${RUNNER_TEMP}/${TARBALL}" --access public --no-git-checks --provenance --tag "${DIST_TAG}"
